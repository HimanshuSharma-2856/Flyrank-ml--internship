<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="title desc">
  <title id="title">Precision at four review budgets on a client-held-out snapshot</title>
  <desc id="desc">Grouped bars compare the transparent rule baseline and random forest at K 10, 20, 50, and 100. A dashed line marks the 0.391 holdout base rate. Random-forest precision is above the rule at all four shown budgets.</desc>
  <rect width="880" height="500" fill="#ffffff"/>
  <text x="54" y="38" fill="#17201d" font-family="Arial, sans-serif" font-size="22" font-weight="700">Precision at the top of the review list</text>
  <text x="54" y="62" fill="#52605a" font-family="Arial, sans-serif" font-size="14">Share labelled declining · same 2,325 client-held-out items</text>
  <g stroke="#d5ded9" stroke-width="1">
    <line x1="104" y1="392" x2="824" y2="392"/><line x1="104" y1="330" x2="824" y2="330"/>
    <line x1="104" y1="268" x2="824" y2="268"/><line x1="104" y1="206" x2="824" y2="206"/>
    <line x1="104" y1="144" x2="824" y2="144"/><line x1="104" y1="82" x2="824" y2="82"/>
  </g>
  <g fill="#34413b" font-family="Arial, sans-serif" font-size="13" text-anchor="end">
    <text x="92" y="397">0.0</text><text x="92" y="335">0.2</text><text x="92" y="273">0.4</text>
    <text x="92" y="211">0.6</text><text x="92" y="149">0.8</text><text x="92" y="87">1.0</text>
  </g>
  <line x1="104" y1="270.8" x2="824" y2="270.8" stroke="#263238" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="638" y="250" width="183" height="23" fill="#ffffff" opacity="0.92"/>
  <text x="816" y="266" fill="#263238" font-family="Arial, sans-serif" font-size="13" text-anchor="end">Base rate 0.391</text>
  <g fill="#c56b45">
    <rect x="164" y="330" width="34" height="62"/><rect x="334" y="314.5" width="34" height="77.5"/>
    <rect x="504" y="305.2" width="34" height="86.8"/><rect x="674" y="277.3" width="34" height="114.7"/>
  </g>
  <g fill="#145c52">
    <rect x="204" y="206" width="34" height="186"/><rect x="374" y="144" width="34" height="248"/>
    <rect x="544" y="186.2" width="34" height="205.8"/><rect x="714" y="171.9" width="34" height="220.1"/>
  </g>
  <g fill="#17201d" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <text x="181" y="323">0.200</text><text x="221" y="199">0.600</text>
    <text x="351" y="307">0.250</text><text x="391" y="137">0.800</text>
    <text x="521" y="298">0.280</text><text x="561" y="179">0.660</text>
    <text x="691" y="270">0.370</text><text x="731" y="165">0.710</text>
  </g>
  <g fill="#34413b" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    <text x="201" y="418">K = 10</text><text x="371" y="418">K = 20</text><text x="541" y="418">K = 50</text><text x="711" y="418">K = 100</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="238" y="451" width="14" height="14" fill="#c56b45"/><text x="260" y="463" fill="#17201d">Rule baseline</text>
    <rect x="395" y="451" width="14" height="14" fill="#145c52"/><text x="417" y="463" fill="#17201d">Random forest</text>
    <line x1="563" y1="458" x2="592" y2="458" stroke="#263238" stroke-width="2" stroke-dasharray="7 5"/><text x="600" y="463" fill="#17201d">Holdout base rate</text>
  </g>
</svg>
